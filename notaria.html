<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notaría Ejemplo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Questrial&display=swap" rel="stylesheet">
</head>

<body class="site-body">

    <!-- ================= HEADER ================= -->
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html">
                <img src="Carrusel/LOGO NOTARÍA FUTRONO.svg" alt="Logo Notaría" class="logo-image">
            </a>
            <button class="menu-toggle" aria-label="Abrir menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav class="main-navigation" id="mainNav">
                <ul class="nav-list">

                    <li class="nav-item">
                        <a href="tramites.html" class="nav-link">Trámites</a>
                    </li>

                    <li class="nav-item">
                        <a href="faq.html" class="nav-link">Preguntas frecuentes</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link">Nuestra notaría</a>
                    </li>

                    <li class="nav-item">
                        <a href="#contacto" class="nav-link">Contacto</a>
                    </li>

                </ul>
            </nav>

        </div>
    </header>

    <main class="site-main">
        <div class="content-wrapper">
            
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p class="footer-text">© 2026 Notaría Ejemplo - Todos los derechos reservados</p>
        </div>
    </footer>

    <script>
        const toggle = document.querySelector(".menu-toggle");
        const nav = document.getElementById("mainNav");

        toggle.addEventListener("click", () => {
            nav.classList.toggle("active");
            toggle.classList.toggle("active");
        });
    </script>

    <script>
        let lastScroll = 0;
        const header = document.querySelector(".site-header");

        window.addEventListener("scroll", () => {
            const currentScroll = window.pageYOffset;

            if (currentScroll > lastScroll && currentScroll > 50) {
                // bajando
                header.classList.add("hidden");
            } else {
                // subiendo
                header.classList.remove("hidden");
            }

            lastScroll = currentScroll;
        });
    </script>

</body>
